<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MEscrowDesk - Google Drive Project Backup</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/30">
          <span class="material-icons text-white text-2xl">cloud_upload</span>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">MEscrowDesk Google Drive Backup</h1>
          <p class="text-sm text-slate-400">Securely export and upload your project files to Google Drive.</p>
        </div>
      </div>
      <a href="/" class="text-sm text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
        <span class="material-icons text-base">arrow_back</span> Dashboard
      </a>
    </div>

    <div id="auth-section" class="mb-6 p-4 bg-slate-800/50 border border-slate-700/50 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="auth-status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="auth-status-text" class="text-sm font-medium text-slate-300">Not signed in with Google</span>
      </div>
      <button id="signin-btn" class="px-4 py-2 bg-white text-slate-900 rounded-lg font-medium text-sm flex items-center gap-2 hover:bg-slate-100 transition shadow">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.18 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Sign in with Google
      </button>
    </div>

    <div class="mb-6">
      <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Project Files to Upload</h3>
      <div id="file-list" class="bg-slate-950 border border-slate-800 rounded-xl p-4 max-h-48 overflow-y-auto space-y-2 text-sm text-slate-300">
        <div class="text-slate-500 animate-pulse">Loading project files...</div>
      </div>
    </div>

    <div class="flex items-center justify-between pt-4 border-t border-slate-800">
      <div id="upload-status" class="text-sm text-slate-400"></div>
      <button id="upload-btn" disabled class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-xl transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
        <span class="material-icons text-lg">cloud_upload</span> Upload Project to Google Drive
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let firebaseConfig = null;
    let accessToken = null;
    let projectFiles = [];

    async function init() {
      try {
        const res = await fetch('/firebase-config');
        firebaseConfig = await res.json();
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/drive.file');

        document.getElementById('signin-btn').addEventListener('click', async () => {
          try {
            const result = await signInWithPopup(auth, provider);
            const credential = GoogleAuthProvider.credentialFromResult(result);
            accessToken = credential?.accessToken;
            updateAuthUI(result.user);
          } catch (err) {
            console.error('Auth error:', err);
            alert('Google Sign-In failed: ' + err.message);
          }
        });

        onAuthStateChanged(auth, (user) => {
          if (user) {
            updateAuthUI(user);
          }
        });

        const filesRes = await fetch('/api/project-files');
        projectFiles = await filesRes.json();
        renderFiles();
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    function updateAuthUI(user) {
      const dot = document.getElementById('auth-status-dot');
      const text = document.getElementById('auth-status-text');
      const btn = document.getElementById('signin-btn');
      const uploadBtn = document.getElementById('upload-btn');

      dot.className = 'w-3 h-3 rounded-full bg-emerald-500';
      text.textContent = 'Signed in as ' + (user.email || user.displayName);
      btn.textContent = 'Signed In';
      btn.disabled = true;
      uploadBtn.disabled = false;
    }

    function renderFiles() {
      const container = document.getElementById('file-list');
      if (!projectFiles.length) {
        container.innerHTML = '<div class="text-slate-500">No project files found.</div>';
        return;
      }
      container.innerHTML = projectFiles.map(f => `
        <div class="flex items-center justify-between py-1 px-2 hover:bg-slate-900 rounded">
          <span class="font-mono text-indigo-400">\${f.path}</span>
          <span class="text-xs text-slate-500">\${f.size} bytes</span>
        </div>
      `).join('');
    }

    document.getElementById('upload-btn').addEventListener('click', async () => {
      if (!accessToken) {
        alert('Please sign in with Google first.');
        return;
      }

      // Mandatory user confirmation dialog before destructive / mutating operation
      const confirmed = window.confirm('Are you sure you want to upload all project files and source code to Google Drive?');
      if (!confirmed) return;

      const statusEl = document.getElementById('upload-status');
      const uploadBtn = document.getElementById('upload-btn');
      uploadBtn.disabled = true;
      statusEl.textContent = 'Preparing project archive...';

      try {
        const bundle = {
          projectName: 'MEscrowDesk',
          exportedAt: new Date().toISOString(),
          files: projectFiles
        };

        statusEl.textContent = 'Uploading to Google Drive...';

        const metadata = {
          name: 'MEscrowDesk-Project-Backup-' + Date.now() + '.json',
          mimeType: 'application/json'
        };

        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' }));

        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
          body: form
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error('Google Drive API error (' + response.status + '): ' + errText);
        }

        const data = await response.json();
        statusEl.innerHTML = '<span class="text-emerald-400 font-medium">Successfully uploaded! File ID: ' + data.id + '</span>';
      } catch (err) {
        console.error('Upload error:', err);
        statusEl.innerHTML = '<span class="text-rose-400 font-medium">Upload failed: ' + err.message + '</span>';
      } finally {
        uploadBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
